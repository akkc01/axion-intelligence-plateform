apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-deploy
  namespace: axion

spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry
  template:
    metadata:
      labels:
        app: telemetry
    spec:
      containers:
        - name: telemetry-container
          image: amitkkc01/axion-telemetry-query:1.0.1
          ports:
            - containerPort: 8000


---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-svc
  namespace: axion
spec:
  selector:
    app: telemetry
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP