apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-deploy
  namespace: axion

spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulation
  template:
    metadata:
      labels:
        app: simulation
    spec:
      containers:
        - name: simulation-container
          image: amitkkc01/axion-simulator:1.0.0
          # ports:
          #   - containerPort: 8000


