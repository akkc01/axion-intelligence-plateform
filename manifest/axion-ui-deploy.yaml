apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui-deploy
  namespace: axion

spec:
  replicas: 1
  selector:
    matchLabels:
      app: axion-ui
  template:
    metadata:
      labels:
        app: axion-ui
    spec:
      containers:
        - name: axion-ui-container
          image: amitkkc01/axion-ui:1.0.1
          ports:
            - containerPort: 80


---
apiVersion: v1
kind: Service
metadata:
  name: axion-ui-svc
  namespace: axion
spec:
  selector:
    app: axion-ui
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP