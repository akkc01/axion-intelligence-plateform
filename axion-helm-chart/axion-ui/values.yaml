namespace: akkc

replicaCount: 1

names:
  deployment: axion-ui-deploy

labels:
  app: axion-ui

container:
  name: axion-ui-container
  port: 80

image:
  repository: amitkkc01/axion-ui
  tag: "2.1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi


service:
  name: axion-ui-svc
  port: 80
  targetPort: 80
  type: ClusterIP


autoscaling:
  enabled: true

  minReplicas: 1
  maxReplicas: 5

  targetCPUUtilizationPercentage: 70