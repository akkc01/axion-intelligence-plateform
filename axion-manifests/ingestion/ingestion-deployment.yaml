apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ingestion

  template:
    metadata:
      labels:
        app: ingestion

    spec:
      containers:
        - name: ingestion
          image: amitkkc01/ingestion-arm64:5.0.1
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              protocol: TCP

          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "250m"

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DATABASE_URL